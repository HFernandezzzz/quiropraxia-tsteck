async function publicarResumo(){
  const mes=prompt("Qual mês publicar? (formato AAAA-MM)",todayISO().slice(0,7));
  if(!mes||!/^\d{4}-\d{2}$/.test(mes)) return;
  const real=state.atendimentos.filter(a=>a.status==="Realizado"&&String(a.data).slice(0,7)===mes);
  const comDor=real.filter(a=>a.dorAntes!=null&&a.dorDepois!=null);
  const notas=real.filter(a=>a.avaliacao).map(a=>Number(a.avaliacao));
  const dias=diasPerdidos(afastMes(mes));
  const doc={
    atendimentos:real.length,
    colaboradores:new Set(real.map(a=>a.pacienteId)).size,
    alivio:comDor.length?Number((comDor.reduce((s,a)=>s+(a.dorAntes-a.dorDepois),0)/comDor.length).toFixed(1)):null,
    diasPerdidos:dias, custo:dias*cfg().custoDia,
    faltas:state.atendimentos.filter(a=>a.status==="Faltou"&&String(a.data).slice(0,7)===mes).length,
    satisfacao:notas.length?Number((notas.reduce((s,n)=>s+n,0)/notas.length).toFixed(1)):null,
    setores:contar(real,a=>{const p=byId("pacientes",a.pacienteId);return p?p.setor:null;}),
    regioes:contar(real,a=>a.regioes||[]),
    publicadoEm:new Date().toISOString()
  };
  await put("resumos",mes,doc);
  toast("Resumo de "+mesLabel(mes)+" publicado para RH e Suprimentos");
}

/* ---- Relatório mensal imprimível ---- */
function ultimosMeses(mes,n){
  const out=[],d=new Date(Number(mes.slice(0,4)),Number(mes.slice(5,7))-1,1);
  for(let i=n-1;i>=0;i--){ const x=new Date(d.getFullYear(),d.getMonth()-i,1); out.push(x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")); }
  return out;
}
function relatorioMensal(mes){
  const c=cfg();
  mes=mes||todayISO().slice(0,7);
  const ant=mesAnterior(mes),A=metricasMes(mes),B=metricasMes(ant);
  const meses=ultimosMeses(mes,6);
  const opcoes=ultimosMeses(todayISO().slice(0,7),12).slice().reverse();
  const serie=k=>meses.map(m=>metricasMes(m)[k]);
  const prof=state.profissionais.filter(p=>p.ativo!==false)[0];
  const getv=(arr,k)=>{ const f=arr.filter(x=>x[0]===k)[0]; return f?f[1]:0; };
  const setores=Array.from(new Set(A.setores.concat(B.setores).map(x=>x[0]))).sort((x,y)=>getv(A.setores,y)-getv(A.setores,x));
  const ergo=alertaErgonomico(),baixo=estoqueBaixo(),sem=semRetorno();

  const frases=[];
  frases.push(`Em ${mesLabel(mes)} foram realizados <b>${plural(A.atendimentos,"atendimento")}</b> na sala de quiropraxia, envolvendo <b>${plural(A.colaboradores,"colaborador","colaboradores")}</b> — ${textoVar(A.atendimentos,B.atendimentos,true)}.`);
  if(A.alivio!=null) frases.push(`A dor relatada caiu em média <b>${A.alivio.toFixed(1)} pontos</b> por sessão na escala de 0 a 10, com chegada média em ${A.dorChegada.toFixed(1)} — ${textoVar(A.alivio,B.alivio,true)}.`);
  if(A.comDor||B.comDor) frases.push(`<b>${plural(A.comDor,"colaborador","colaboradores")}</b> chegaram com dor moderada ou forte (nota 4 ou mais): ${textoVar(A.comDor,B.comDor,false)}.`);
  frases.push(`Foram registrados <b>${plural(A.dias,"dia")}</b> de afastamento ligados a queixas musculoesqueléticas, equivalentes a <b>${brl(A.custo)}</b> pelo parâmetro interno de ${brl(c.custoDia)} por dia — ${textoVar(A.dias,B.dias,false)}.`);
  if(A.satisfacao!=null) frases.push(`A satisfação média declarada pelos colaboradores foi de <b>${A.satisfacao.toFixed(1)} de 5</b>.`);
  if(A.faltas) frases.push(`Houve <b>${plural(A.faltas,"falta")}</b> em sessões agendadas, ${textoVar(A.faltas,B.faltas,false)}.`);

  const acoes=[];
  ergo.slice(0,3).forEach(e=>acoes.push(`Avaliar ergonomicamente os postos de <b>${esc(e.setor)}</b>: ${e.n} colaboradores apresentam queixa na região ${esc(e.regiao.toLowerCase())}, o que sugere causa no posto e não apenas individual.`));
  if(sem.length) acoes.push(`Reconvocar <b>${plural(sem.length,"colaborador","colaboradores")}</b> sem retorno há mais de ${c.diasRetorno} dias, para não perder o ganho já obtido.`);
  if(baixo.length) acoes.push(`Repor <b>${plural(baixo.length,"item","itens")}</b> abaixo do estoque mínimo, sob risco de suspensão dos atendimentos.`);
  if(A.faltas>A.atendimentos*0.15&&A.atendimentos) acoes.push(`Revisar os horários da agenda junto às lideranças: o índice de faltas do mês está acima de 15% das sessões marcadas.`);
  if(!acoes.length) acoes.push("Nenhum ponto crítico identificado no período. Manter a rotina de sessões e o acompanhamento dos indicadores.");

  openModal("Relatório mensal","Documento para RH, SESMT e gestão — sem identificação de colaborador",`
  <div class="rep">
    <div class="no-print" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)">
      <label class="mini" for="repmes">Competência</label>
      <select id="repmes" data-repmes style="background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;font-size:13px">
        ${opcoes.map(m=>`<option value="${m}"${m===mes?" selected":""}>${esc(mesLabel(m))}</option>`).join("")}</select>
      <div style="flex:1"></div>
      <button type="button" class="btn sm" data-act="imprimir">Imprimir / salvar PDF</button>
    </div>

    <div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:nowrap;border-bottom:2px solid var(--red);padding-bottom:10px">
      <svg class="logo" style="width:132px"><use href="#tsteck"/></svg>
      <div style="padding-bottom:2px">
        <div style="font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink)">Relatório mensal · Sala de Quiropraxia</div>
        <div class="mini">Programa de saúde ocupacional · ${esc(c.empresa)}</div>
      </div>
    </div>
    <div class="mini" style="display:flex;gap:18px;flex-wrap:wrap;margin-top:8px">
      <span><b style="color:var(--ink-2)">Competência:</b> ${esc(mesLabel(mes))}</span>
      <span><b style="color:var(--ink-2)">Emissão:</b> ${fdate(todayISO())}</span>
      <span><b style="color:var(--ink-2)">Base de comparação:</b> ${esc(mesLabel(ant))}</span>
      ${prof?`<span><b style="color:var(--ink-2)">Responsável técnico:</b> ${esc(prof.nome)}</span>`:""}
    </div>
    ${mes===todayISO().slice(0,7)?`<div class="alert warn" style="margin-top:10px"><div class="grow"><b>Competência em andamento</b><div style="opacity:.9">Os números refletem o mês até ${fdate(todayISO())} e ainda vão mudar até o fechamento. Para comparação fechada, selecione o mês anterior.</div></div></div>`:""}

    <div class="repsec"><div class="h">Resumo executivo</div>
      <div class="lead">${frases.map(f=>"<p style=\"margin:0 0 8px\">"+f+"</p>").join("")}</div>
    </div>

    <div class="repsec"><div class="h">Indicadores do mês</div>
      <div class="repgrid">
        ${tileD("Atendimentos",A.atendimentos,"realizados no mês",deltaHTML(A.atendimentos,B.atendimentos,true),true)}
        ${tileD("Colaboradores",A.colaboradores,"pessoas distintas",deltaHTML(A.colaboradores,B.colaboradores,true))}
        ${tileD("Com dor 4+",A.comDor,"na chegada",deltaHTML(A.comDor,B.comDor,false))}
        ${tileD("Alívio médio",A.alivio==null?"—":"−"+A.alivio.toFixed(1),"escala 0–10",deltaHTML(A.alivio,B.alivio,true))}
        ${tileD("Dias perdidos",A.dias,brl(A.custo)+" estimados",deltaHTML(A.dias,B.dias,false))}
        ${tileD("Satisfação",A.satisfacao==null?"—":A.satisfacao.toFixed(1)+"/5","média das notas",deltaHTML(A.satisfacao,B.satisfacao,true))}
      </div>
    </div>

    <div class="repsec"><div class="h">Comparativo com ${esc(mesLabel(ant))}</div>
      ${tabelaComparativa(mes,ant)}
    </div>

    <div class="repsec"><div class="h">Evolução de ${esc(mesLabel(meses[0]))} a ${esc(mesLabel(mes))}</div>
      <div style="font-size:11.5px;font-weight:600;color:var(--ink-2);margin-bottom:4px">Atendimentos realizados por mês</div>
      ${barrasVar(meses,serie("atendimentos"),true)}
      <div style="font-size:11.5px;font-weight:600;color:var(--ink-2);margin:14px 0 4px">Variação percentual dos atendimentos</div>
      ${barrasDiverg(meses,serie("atendimentos"),true)}
      <div style="font-size:11.5px;font-weight:600;color:var(--ink-2);margin:16px 0 4px">Dias perdidos por afastamento</div>
      ${barrasVar(meses,serie("dias"),false)}
    </div>

    <div class="repsec"><div class="h">Distribuição por setor</div>
      ${setores.length?`<div class="tblwrap"><table class="cmp"><thead><tr><th>Setor</th><th style="text-align:right">${esc(mesLabel(ant))}</th><th style="text-align:right">${esc(mesLabel(mes))}</th><th style="text-align:right">Variação</th></tr></thead><tbody>
        ${setores.map(k=>`<tr><td>${esc(k)}</td><td class="n">${getv(B.setores,k)}</td><td class="n">${getv(A.setores,k)}</td><td class="n">${deltaHTML(getv(A.setores,k),getv(B.setores,k),true)}</td></tr>`).join("")}
      </tbody></table></div>`:`<div class="mini">Sem atendimentos registrados nos dois meses comparados.</div>`}
    </div>

    <div class="repsec"><div class="h">Regiões tratadas no mês</div>
      ${hbars(A.regioes,"Sem atendimentos no mês")}
    </div>

    <div class="repsec"><div class="h">Pontos de atenção e ações recomendadas</div>
      <ol style="margin:0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--ink-2)">${acoes.map(a=>"<li style=\"margin-bottom:5px\">"+a+"</li>").join("")}</ol>
    </div>

    <div class="sign">
      <div>${prof?esc(prof.nome):"Responsável técnico"}<br><span style="font-size:10.5px">${prof&&prof.registro?esc(prof.registro):"Quiropraxia"}</span></div>
      <div>${esc(c.empresa)}<br><span style="font-size:10.5px">Segurança e Saúde no Trabalho</span></div>
    </div>

    <div class="repfoot">
      <span>${esc(c.empresa)} · Sala de Quiropraxia · competência ${esc(mesLabel(mes))}</span>
      <span>Documento com dados agregados. Não contém informação de saúde identificável (LGPD, art. 11).</span>
    </div>
  </div>`,`<div style="flex:1"></div><button type="button" class="btn ghost" data-close="1">Fechar</button><button type="button" class="btn" data-act="imprimir">Imprimir / salvar PDF</button>`);
  modalSubmit=null;
}

/* ===================== EVENTOS ===================== */
document.addEventListener("click",async e=>{
  if(e.target.closest("[data-close]")){ closeModal(); return; }
  const g=e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  const ab=e.target.closest("[data-aba]"); if(ab){ const [m,v]=ab.dataset.aba.split(":"); ctx.aba[m]=v; render(); return; }
  const sm=e.target.closest("[data-sem]"); if(sm){ const d=Number(sm.dataset.sem); ctx.semana=d?addDays(ctx.semana,d):inicioSemana(todayISO()); render(); return; }
  const sl=e.target.closest("[data-slot]"); if(sl&&!e.target.closest(".ap")){ formAtendimento(null,"",false,sl.dataset.slot); return; }
  const fi=e.target.closest("[data-filtro]"); if(fi){ ctx.filtroAt=fi.dataset.filtro; render(); return; }
  const fs=e.target.closest("[data-fsol]"); if(fs){ ctx.filtroSol=fs.dataset.fsol; render(); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const id=b.dataset.id,act=b.dataset.act;
  if(act==="novo-paciente") formPaciente(null);
  else if(act==="edit-paciente"){ closeModal(); formPaciente(id); }
  else if(act==="ficha"){ ctx.paciente=id; route="pacientes"; render(); window.scrollTo({top:0}); }
  else if(act==="voltar-lista"){ ctx.paciente=null; render(); }
  else if(act==="kiosk") formKiosk();
  else if(act==="imprimir") window.print();
  else if(act==="novo-atend") formAtendimento(null,id||ctx.paciente||"");
  else if(act==="edit-atend"){ closeModal(); formAtendimento(id); }
  else if(act==="concluir") formAtendimento(id,null,true);
  else if(act==="nova-sol") formSolicitacao(null);
  else if(act==="ver-sol"){ closeModal(); formSolicitacao(id); }
  else if(act==="gerar-sol-falta") gerarSolDeFalta();
  else if(act==="novo-item") formItem(null);
  else if(act==="edit-item"){ closeModal(); formItem(id); }
  else if(act==="mov-form"){ closeModal(); formMov(id); }
  else if(act==="novo-prof") formProfissional(null);
  else if(act==="edit-prof"){ closeModal(); formProfissional(id); }
  else if(act==="afastar"){ closeModal(); formAfastamento(id||ctx.paciente||""); }
  else if(act==="assinar"){ closeModal(); formAssinatura(id); }
  else if(act==="anexar") anexarArquivo(id);
  else if(act==="relatorio") relatorioMensal();
  else if(act==="publicar-resumo") publicarResumo();
  else if(act==="exp-pac") exportar("pac");
  else if(act==="exp-atend") exportar("atend");
  else if(act==="exp-sol") exportar("sol");
  else if(act==="exp-est") exportar("est");
  else if(act==="exp-mov") exportar("mov");
  else if(act==="exp-json") exportar("json");
  else if(act==="revisar-anamnese"){
    const p=byId("pacientes",id); if(!p) return;
    const c=Object.assign({},p); delete c.id; c.revisado=true;
    await put("pacientes",id,c); toast("Anamnese revisada");
  }
  else if(act==="rm-anexo"){
    const p=byId("pacientes",id); if(!p) return;
    const i=Number(b.dataset.i),an=(p.anexos||[])[i];
    if(!an||!confirm("Remover o anexo “"+an.nome+"”? A exclusão é definitiva.")) return;
    const c=Object.assign({},p); delete c.id;
    c.anexos=(p.anexos||[]).filter((x,k)=>k!==i);
    await put("pacientes",id,c);
    if(ASSETS){ try{ await ASSETS.delete(an.id); }catch(err){} }
    toast("Anexo removido");
  }
  else if(act==="mov-rapida"){
    const it=byId("estoque",id); if(!it) return;
    const d=Number(b.dataset.d),c=Object.assign({},it); delete c.id;
    c.quantidade=Math.max(0,Number(it.quantidade||0)+d);
    if(c.quantidade===Number(it.quantidade||0)) return;
    await put("estoque",id,c);
    await registrarMov(it,d>0?"Entrada":"Saída",1,"Ajuste rápido");
  }
  else if(act==="del-paciente"){ if(confirm("Excluir a ficha? Os atendimentos ficam no histórico, mas sem vínculo.")){ closeModal(); ctx.paciente=null; await del("pacientes",id); toast("Ficha excluída"); } }
  else if(act==="del-atend"){ if(confirm("Excluir este atendimento?")){ closeModal(); await del("atendimentos",id); toast("Atendimento excluído"); } }
  else if(act==="del-sol"){ if(confirm("Excluir esta solicitação?")){ closeModal(); await del("solicitacoes",id); toast("Solicitação excluída"); } }
  else if(act==="del-item"){ if(confirm("Excluir este item do estoque?")){ closeModal(); await del("estoque",id); toast("Item excluído"); } }
  else if(act==="del-prof"){ if(confirm("Excluir este profissional?")){ closeModal(); await del("profissionais",id); toast("Profissional excluído"); } }
  else if(act==="del-afast"){ if(confirm("Excluir este afastamento?")){ await del("afastamentos",id); toast("Afastamento excluído"); } }
  else if(act==="limpar-exemplos"){
    if(!confirm("Apagar todos os registros de demonstração? O que você cadastrou permanece.")) return;
    for(const col of COLS){ for(const r of state[col].filter(x=>x.exemplo)) await del(col,r.id); }
    toast("Dados de exemplo removidos");
  }
});
document.addEventListener("change",e=>{
  if(e.target.matches("[data-metrica]")){ ctx.metrica=e.target.value; render(); }
  if(e.target.matches("[data-repmes]")){ relatorioMensal(e.target.value); }
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="cfgform") return;
  e.preventDefault();
  const fd=new FormData(e.target),o={};
  o.empresa=(fd.get("empresa")||"").toString();
  ["custoDia","passo","duracao","diasRetorno","diasValidade","janelaConsumo"].forEach(k=>o[k]=Number(fd.get(k)||0));
  o.horaInicio=fd.get("horaInicio"); o.horaFim=fd.get("horaFim");
  o.diasSemana=fd.getAll("diasSemana").map(Number);
  if(!o.diasSemana.length) o.diasSemana=[1,2,3,4,5];
  await put("config","geral",o);
  toast("Parâmetros salvos");
});
$("#q").addEventListener("input",e=>{
  busca=e.target.value;
  if(["painel","config","indicadores"].indexOf(route)>=0) route=EU.admin?"pacientes":"estoque";
  ctx.paciente=null;
  render();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeModal(); return; }
  const dentro=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable;
  if(dentro||e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="/"){ e.preventDefault(); $("#q").focus(); return; }
  if(e.key==="n"){
    e.preventDefault();
    if(route==="pacientes") formPaciente(null);
    else if(route==="agenda") formAtendimento(null,"");
    else if(route==="solicitacoes") formSolicitacao(null);
    else if(route==="estoque") formItem(null);
  }
});

/* ===================== INÍCIO ===================== */
render();
boot();
</script>
