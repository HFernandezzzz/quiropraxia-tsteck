<title>Quiropraxia TS Teck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#FAF7F8; --surface:#FFFFFF; --surface-2:#F5F0F1; --surface-3:#EFE8EA;
  --ink:#1A1215; --ink-2:#4A3E43; --muted:#7C6D72;
  --line:#E9E1E4; --line-2:#D9CED2;
  --red:#C8102E; --red-2:#9A0B23; --red-soft:#FCEDEF; --red-line:#F1CBD2;
  --ok:#0E7C52; --ok-soft:#E4F3EC;
  --warn:#9C5B00; --warn-soft:#FAEFDD;
  --crit:#B3121F; --crit-soft:#FBE7E9;
  --info:#2A4F86; --info-soft:#E8EEF8;
  --on-red:#FFFFFF;
  --shadow:0 1px 2px rgba(26,18,21,.05), 0 10px 26px -20px rgba(26,18,21,.45);
  --r:10px;
  --display:"Archivo","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
:root{color-scheme:light}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:230px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top,0px)}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:18px 16px 14px}
.logo{display:block;width:138px;height:auto;color:var(--ink);flex:none}
.brand .txt{font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--red-2);font-weight:700;border-top:2px solid var(--red);padding-top:5px;width:138px}
.navlabel{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:10px 18px 6px;font-weight:600}
nav{display:flex;flex-direction:column;gap:1px;padding:0 10px;overflow-y:auto}
.nav-i{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;background:none;border:0;cursor:pointer;text-align:left;color:var(--ink-2);font-weight:500;position:relative;width:100%}
.nav-i svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav-i:hover{background:var(--surface-2);color:var(--ink)}
.nav-i[aria-current="page"]{background:var(--red-soft);color:var(--red-2);font-weight:600}
.nav-i[aria-current="page"] svg{opacity:1}
.nav-i .tag{margin-left:auto;background:var(--red);color:var(--on-red);font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:99px;min-width:19px;text-align:center}
.side-foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:99px;background:var(--ok);flex:none}
.dot.off{background:var(--warn)}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 22px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:18px;font-weight:600}
.top .sub{font-size:12px;color:var(--muted);margin-top:1px}
.top .grow{flex:1 1 120px}
.search{display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-width:180px}
.search input{background:none;border:0;outline:0;width:100%;font-size:13px}
.search svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:1.8;flex:none}
.wrap{padding:22px;display:flex;flex-direction:column;gap:18px;flex:1}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;gap:8px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:0 12px;padding-top:env(safe-area-inset-top,0px)}
  .brand{flex-direction:row;align-items:center;gap:8px;padding:9px 10px 9px 0}
  .logo{width:92px}
  .brand .txt{display:none}
  .navlabel,.side-foot{display:none}
  nav{flex-direction:row;padding:8px 0;gap:4px}
  .nav-i{white-space:nowrap;padding:7px 11px}
  .wrap,.top{padding-left:16px;padding-right:16px}
}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:14px;font-weight:600;letter-spacing:0}
.card-h .grow{flex:1}
.card-b{padding:16px}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--red);color:var(--on-red);border:1px solid var(--red);padding:7px 13px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--red-2);border-color:var(--red-2)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.ghost{background:var(--surface);color:var(--ink-2);border-color:var(--line-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.danger{background:var(--surface);color:var(--crit);border-color:var(--red-line)}
.btn.danger:hover{background:var(--crit-soft)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2.5px 9px;border-radius:99px;border:1px solid transparent;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 32%,transparent)}
.pill.info{background:var(--info-soft);color:var(--info);border-color:color-mix(in srgb,var(--info) 30%,transparent)}
.pill.mute{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.tile .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .n{font-size:11.5px;color:var(--muted)}
.tile.accent{border-left:3px solid var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}
@media (max-width:1000px){.grid2,.grid3{grid-template-columns:1fr}}

.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td .nm{font-weight:600}
td .sm{font-size:11.5px;color:var(--muted)}
.rowact{display:flex;gap:6px;justify-content:flex-end}
.empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--ink-2);font-family:var(--display);font-size:14px;margin-bottom:3px}

/* ---------- forms ---------- */
.f{display:grid;gap:13px}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:11.5px;font-weight:600;color:var(--ink-2);min-width:0}
label.fl input,label.fl select,label.fl textarea{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 9px;font-size:13px;font-weight:400;width:100%}
label.fl textarea{resize:vertical;min-height:62px}
label.fl input:focus,label.fl select:focus,label.fl textarea:focus{border-color:var(--red);outline:0;box-shadow:0 0 0 3px var(--red-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;font-weight:500}
.chip input{accent-color:var(--red);margin:0}
.chip:has(input:checked){background:var(--red-soft);border-color:var(--red-line);color:var(--red-2);font-weight:600}
.sect{border-top:1px solid var(--line);padding-top:13px;margin-top:3px}
.sect>.st{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--red-2);margin-bottom:11px;display:flex;align-items:center;gap:7px}
.sect>.st::after{content:"";height:1px;background:var(--red-line);flex:1}
.itemrow{display:grid;grid-template-columns:2.4fr .7fr .9fr auto;gap:8px;align-items:end}
@media (max-width:640px){.itemrow{grid-template-columns:1fr 1fr;}}
.icon-btn{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--crit);border-color:var(--red-line);background:var(--crit-soft)}
.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(20,12,15,.5);backdrop-filter:blur(2px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:22px 14px;overflow-y:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;width:min(780px,100%);box-shadow:0 30px 70px -30px rgba(0,0,0,.6);margin:auto}
.modal-h{display:flex;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);border-radius:14px 14px 0 0;z-index:2}
.modal-h h3{font-size:16px;font-weight:600}
.modal-h .sub{font-size:12px;color:var(--muted)}
.modal-b{padding:18px 20px}
.modal-f{display:flex;gap:9px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);border-radius:0 0 14px 14px;flex-wrap:wrap}

/* ---------- misc ---------- */
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border-radius:9px;border:1px solid;font-size:12.5px}
.alert b{font-weight:600}
.alert.crit{background:var(--crit-soft);border-color:var(--red-line);color:var(--crit)}
.alert.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 28%,transparent);color:var(--warn)}
.alert.info{background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 25%,transparent);color:var(--info)}
.alert .grow{flex:1}
.stack{display:flex;flex-direction:column;gap:9px}
.bar{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px}
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:118px 1fr 38px;gap:10px;align-items:center;font-size:12.5px}
.hbar .lb{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .vv{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
@media (max-width:520px){.hbar{grid-template-columns:92px 1fr 32px}}
.tl{display:flex;flex-direction:column;gap:0}
.tl-i{display:grid;grid-template-columns:22px 1fr;gap:12px}
.tl-i .rail{display:flex;flex-direction:column;align-items:center}
.tl-i .bl{width:10px;height:10px;border-radius:99px;background:var(--red);margin-top:5px;flex:none}
.tl-i .ln{width:1.5px;flex:1;background:var(--line);min-height:12px}
.tl-i:last-child .ln{background:transparent}
.tl-b{padding-bottom:16px;min-width:0}
.mono{font-family:var(--mono);font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:13px}
.kv dt{color:var(--muted);font-size:11.5px;font-weight:600;padding-top:1px}
.kv dd{margin:0}
.banner{display:flex;gap:10px;align-items:center;padding:9px 14px;border-radius:9px;background:var(--surface-2);border:1px dashed var(--line-2);font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.banner .grow{flex:1;min-width:120px}
.loading{padding:50px;text-align:center;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--red-2);box-shadow:var(--shadow)}
.printhead{display:none}
@page{size:A4;margin:14mm 13mm}
@media print{
  .printhead{display:flex!important;align-items:flex-end;gap:14px;border-bottom:2px solid var(--red);padding-bottom:8px;margin-bottom:16px}
  .printhead .logo{width:120px}
  .printhead .ph{font-family:var(--display);font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase;padding-bottom:2px}
  .side,.top,.modal-f,.modal-h,.no-print{display:none!important}
  .app{display:block}.wrap{padding:0;gap:12px}
  .card{border:1px solid var(--line);box-shadow:none;break-inside:avoid}
  body{background:#fff;font-size:11.5px}
  body.has-modal .app{display:none!important}
  body.has-modal .ov{position:static;background:none;backdrop-filter:none;padding:0;display:block;overflow:visible}
  body.has-modal .modal{width:100%;max-width:100%;border:0;border-radius:0;box-shadow:none;margin:0}
  body.has-modal .modal-b{padding:0}
  .tile,.hbars,table,svg{break-inside:avoid}
  .repsec>.h{break-after:avoid}
  .pbreak{break-before:page}
  a[href]:after{content:""}
}


/* ---------- v3: comparativos e relatório ---------- */
.delta{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid transparent;white-space:nowrap;font-variant-numeric:tabular-nums}
.delta.up{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 32%,transparent)}
.delta.down{background:var(--crit-soft);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 32%,transparent)}
.delta.flat{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.tile .d{margin-top:5px}
.cmp{width:100%;border-collapse:collapse;font-size:12.5px}
.cmp th{background:var(--surface-2);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}
.cmp td{padding:8px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.cmp td:first-child{font-weight:600}
.cmp td.n{text-align:right}
.cmp tr:last-child td{border-bottom:0}
.rep{max-width:780px;margin:0 auto;color:var(--ink)}
.repsec{margin-top:18px}
.repsec>.h{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--red-2);display:flex;align-items:center;gap:9px;margin-bottom:10px}
.repsec>.h::after{content:"";height:1px;background:var(--red-line);flex:1}
.lead{font-size:13.5px;line-height:1.62;color:var(--ink-2)}
.lead b{color:var(--ink)}
.sign{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:34px}
.sign div{border-top:1px solid var(--ink-2);padding-top:6px;font-size:11.5px;color:var(--muted);text-align:center}
.repfoot{margin-top:22px;border-top:1px solid var(--line);padding-top:8px;font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.metricsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.metricsel select{background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:5px 9px;font-size:12.5px}

/* ---------- v2 ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--red-2);border-bottom-color:var(--red)}
.wk{display:grid;grid-template-columns:58px repeat(var(--cols,6),minmax(108px,1fr));min-width:700px}
.wk .hd{position:sticky;top:0;background:var(--surface-2);border-bottom:1px solid var(--line);padding:7px 6px;text-align:center;font-size:11px;font-weight:600;color:var(--ink-2);z-index:1}
.wk .hd small{display:block;color:var(--muted);font-weight:500;font-size:10px}
.wk .hd.today{color:var(--red-2);background:var(--red-soft)}
.wk .hr{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:4px 5px;font-size:10.5px;color:var(--muted);text-align:right;font-family:var(--mono)}
.wk .cel{border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-height:38px;padding:3px;cursor:pointer;position:relative}
.wk .cel:hover{background:var(--red-soft)}
.wk .ap{display:block;width:100%;text-align:left;border:1px solid var(--red-line);background:var(--red-soft);color:var(--red-2);border-radius:6px;padding:3px 6px;font-size:11px;font-weight:600;cursor:pointer;line-height:1.25;overflow:hidden}
.wk .ap small{display:block;font-weight:500;opacity:.85;font-size:10px}
.wk .ap.done{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent);color:var(--ok)}
.wk .ap.miss{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:var(--warn)}
.wk .ap.canc{background:var(--surface-2);border-color:var(--line-2);color:var(--muted);text-decoration:line-through}
.bodymap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.bodymap svg{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;touch-action:manipulation;max-width:100%;height:auto}
.bodymap .cap{text-align:center;font-size:11px;color:var(--muted);font-weight:600;margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
.intsel{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.intsel button{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:3px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.intsel button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on-red)}
.sigpad{border:1px dashed var(--line-2);border-radius:10px;background:var(--surface);touch-action:none;width:100%;max-width:420px;height:150px;display:block}
.filechip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:8px;padding:5px 9px;font-size:12px;background:var(--surface);max-width:100%}
.filechip a{color:var(--red-2);font-weight:600;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filechip a:hover{text-decoration:underline}
.mini{font-size:11px;color:var(--muted)}
.swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

<script>
/* =====================================================================
   ADAPTADOR DE PERSISTÊNCIA — SUBSTITUIR PELA API DA TS TECK
   ---------------------------------------------------------------------
   O aplicativo NÃO conhece banco de dados. Ele conversa apenas com o
   objeto window.Sistema.servico(nome), que devolve quatro serviços:

     "db"        -> banco de documentos (obrigatório)
     "user"      -> identidade e nível de acesso do usuário logado
     "downloads" -> entrega de arquivo (CSV/JSON) ao usuário
     "assets"    -> upload de anexos e assinatura (opcional)

   A implementação abaixo é um STUB que grava no localStorage do
   navegador, apenas para o sistema abrir e ser navegado sem backend.
   Para produção, troque o corpo das funções por chamadas HTTP à API.
   A documentação técnica descreve o contrato de cada método.
   ===================================================================== */
(function(){
  var KEY="tsteck_quiro_v1";
  var mem={}; try{ mem=JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ mem={}; }
  var listeners={};
  function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(mem)); }catch(e){} }
  function emit(col){ (listeners[col]||[]).forEach(function(cb){ cb(snapshot(col)); }); }
  function snapshot(col){
    var o=mem[col]||{};
    return { docs:Object.keys(o).map(function(id){ return { id:id, exists:true, data:function(){ return o[id]; }, metadata:{fromCache:false,hasPendingWrites:false} }; }) };
  }
  var db={
    collection:function(col){
      return {
        /* GET /api/<col>  + stream (SSE/WebSocket) ou polling */
        onSnapshot:function(next,err){
          (listeners[col]=listeners[col]||[]).push(next);
          setTimeout(function(){ next(snapshot(col)); },0);
          return function(){ listeners[col]=(listeners[col]||[]).filter(function(f){ return f!==next; }); };
        },
        doc:function(id){
          return {
            /* PUT /api/<col>/<id> */
            set:function(data){ mem[col]=mem[col]||{}; mem[col][id]=data; persist(); emit(col); return Promise.resolve(); },
            /* DELETE /api/<col>/<id> */
            delete:function(){ if(mem[col]) delete mem[col][id]; persist(); emit(col); return Promise.resolve(); },
            get:function(){ return Promise.resolve({exists:!!(mem[col]&&mem[col][id]),data:function(){ return mem[col]&&mem[col][id]; }}); }
          };
        }
      };
    }
  };
  var user={
    /* GET /api/me -> { id, nome, perfil: "clinico" | "operacional" } */
    me:function(){ return Promise.resolve({id:"u_local",name:"Usuário local",canEdit:true,isOwner:true,avatarUrl:"",color:"#C8102E",email:null}); },
    id:function(){ return Promise.resolve("u_local"); },
    canEdit:function(){ return Promise.resolve(true); },
    isOwner:function(){ return Promise.resolve(true); },
    can:function(){ return Promise.resolve(true); },
    profiles:function(ids){ var r={}; (Array.isArray(ids)?ids:[ids]).forEach(function(i){ r[i]={id:i,name:"Usuário local",avatarUrl:"",color:"#C8102E",email:null,isMe:true}; }); return Promise.resolve(r); }
  };
  var downloads={
    save:function(req){
      var blob=new Blob([req.data],{type:"application/octet-stream"});
      var a=document.createElement("a");
      a.href=URL.createObjectURL(blob); a.download=req.filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); },4000);
      return Promise.resolve({status:"saved"});
    }
  };
  /* assets: exige armazenamento de arquivos (disco, S3, MinIO).
     Enquanto for null, o sistema esconde anexo e assinatura. */
  var assets=null;

  window.Sistema={ servico:function(n){
    return Promise.resolve(n==="db"?db:n==="user"?user:n==="downloads"?downloads:n==="assets"?assets:null);
  }};
})();
</script>

/* ===================== UTIL ===================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.prototype.slice.call(r.querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO=()=>new Date().toLocaleDateString("en-CA");
const isoOf=dt=>dt.toLocaleDateString("en-CA");
function fdate(d){ if(!d) return "—"; const p=String(d).slice(0,10).split("-"); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; }
function fdateShort(d){ if(!d) return "—"; const p=String(d).slice(0,10).split("-"); return p.length===3?`${p[2]}/${p[1]}`:d; }
function daysBetween(a,b){ return Math.round((new Date(b+"T00:00")-new Date(a+"T00:00"))/86400000); }
function addDays(iso,n){ const d=new Date(iso+"T00:00"); d.setDate(d.getDate()+n); return isoOf(d); }
function idade(nasc){ if(!nasc) return null; const n=new Date(nasc+"T00:00"),h=new Date(); let a=h.getFullYear()-n.getFullYear(); const m=h.getMonth()-n.getMonth(); if(m<0||(m===0&&h.getDate()<n.getDate()))a--; return a; }
function brl(v){ return "R$ "+Number(v||0).toLocaleString("pt-BR",{minimumFractionDigits:0,maximumFractionDigits:0}); }
function mesLabel(m){ const p=String(m).split("-"); return p[1]+"/"+p[0]; }
function mesCurto(m){ return String(m).slice(5)+"/"+String(m).slice(2,4); }
function plural(n,s,p){ return n+" "+(Number(n)===1?s:(p||s+"s")); }
function inicioSemana(iso){ const d=new Date(iso+"T00:00"); d.setDate(d.getDate()-d.getDay()); return isoOf(d); }
function toast(msg,kind){
  const t=document.createElement("div");
  t.textContent=msg;
  t.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:300;background:var(--surface);border:1px solid var(--line-2);border-left:3px solid "+(kind==="crit"?"var(--crit)":"var(--ok)")+";color:var(--ink);padding:10px 16px;border-radius:9px;box-shadow:0 14px 34px -14px rgba(0,0,0,.5);font-size:13px;font-weight:500;max-width:90vw";
  document.body.appendChild(t); setTimeout(()=>t.remove(),3400);
}

/* ===================== ESTADO ===================== */
const COLS=["pacientes","atendimentos","solicitacoes","estoque","movimentacoes","afastamentos","profissionais","resumos","config"];
const COLS_CLINICAS=["pacientes","atendimentos","afastamentos"];
const state={pacientes:[],atendimentos:[],solicitacoes:[],estoque:[],movimentacoes:[],afastamentos:[],profissionais:[],resumos:[],config:[]};
let DB=null,USER=null,DOWNLOADS=null,ASSETS=null;
let ready=false,route="painel",busca="",ctx={aba:{},semana:inicioSemana(todayISO())};
let EU={id:null,nome:"",admin:false,podeEscrever:true};
let perfis={};

function byId(col,id){ return state[col].find(x=>x.id===id); }
function cfg(){ const c=byId("config","geral")||{}; return Object.assign({},CFG_PADRAO,c); }

async function put(col,id,data,silencioso){
  const body=Object.assign({},data);
  delete body.id;
  body.atualizadoEm=new Date().toISOString();
  if(EU.id) body.alteradoPor=EU.id;
  if(!body.criadoPor&&EU.id) body.criadoPor=EU.id;
  if(DB){ try{ await DB.collection(col).doc(id).set(body); }catch(e){ if(!silencioso) toast("Não foi possível salvar ("+((e&&e.code)||"erro")+")","crit"); throw e; } }
  else{ const i=state[col].findIndex(x=>x.id===id); const rec=Object.assign({id},body); if(i<0)state[col].push(rec); else state[col][i]=rec; render(); }
  return id;
}
async function del(col,id){
  if(DB){ try{ await DB.collection(col).doc(id).delete(); }catch(e){ toast("Não foi possível excluir","crit"); } }
  else{ state[col]=state[col].filter(x=>x.id!==id); render(); }
}

async function boot(){
  const use=n=>{ try{ return window.Sistema&&Sistema.servico?Sistema.servico(n):Promise.resolve(null); }catch(e){ return Promise.resolve(null); } };
  const [db,u,dl,as]=await Promise.all([use("db"),use("user"),use("downloads"),use("assets")]);
  DB=db; USER=u; DOWNLOADS=dl; ASSETS=as;
  if(USER){
    try{ const me=await USER.me(); EU.id=me.id; EU.nome=me.name||""; EU.admin=!!me.canEdit; }catch(e){}
    try{ const w=await USER.can("data.write"); EU.podeEscrever=(w===null?true:w); }catch(e){}
  }
  if(DB){
    COLS.forEach(col=>{
      if(COLS_CLINICAS.indexOf(col)>=0&&!EU.admin&&USER) { /* sem permissão: assina mesmo assim, volta vazio */ }
      DB.collection(col).onSnapshot(snap=>{
        state[col]=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
        ready=true; render();
      },err=>{ ready=true; render(); });
    });
    setConn(true,EU.admin?"Sincronizado":"Sincronizado · acesso operacional");
  }else{ setConn(false,"Modo local (sem salvar)"); }
  ready=true; render();
  setTimeout(()=>{ ready=true; render(); },3500);
}
function setConn(on,txt){ $("#conn-dot").className="dot"+(on?"":" off"); $("#conn-txt").textContent=txt; }
async function nomesDe(ids){
  const u=Array.from(new Set(ids.filter(Boolean)));
  if(!u.length||!USER) return {};
  try{ const ps=await USER.profiles(u); perfis=Object.assign(perfis,ps); return ps; }catch(e){ return {}; }
}
function nomeDe(id){ const p=perfis[id]; return (p&&p.name)||""; }

/* ===================== DERIVADOS ===================== */
function estoqueBaixo(){ return state.estoque.filter(i=>Number(i.quantidade||0)<=Number(i.minimo||0)); }
function validadeProxima(){ const h=todayISO(),d=cfg().diasValidade; return state.estoque.filter(i=>i.validade&&daysBetween(h,i.validade)<=d); }
function solPendentes(){ return state.solicitacoes.filter(s=>s.status==="Pendente"); }
function sessoesDe(d){ return state.atendimentos.filter(a=>a.data===d).sort((a,b)=>String(a.hora).localeCompare(String(b.hora))); }
function atendDoPaciente(id){ return state.atendimentos.filter(a=>a.pacienteId===id).sort((a,b)=>String(b.data+(b.hora||"")).localeCompare(String(a.data+(a.hora||"")))); }
function anamnesesPendentes(){ return state.pacientes.filter(p=>p.origem==="autoatendimento"&&!p.revisado); }
function semRetorno(){
  const h=todayISO(),lim=cfg().diasRetorno;
  return state.pacientes.filter(p=>{
    if(p.ativo===false) return false;
    if(state.atendimentos.some(a=>a.pacienteId===p.id&&a.status==="Agendado"&&a.data>=h)) return false;
    const ats=atendDoPaciente(p.id).filter(a=>a.status==="Realizado");
    if(!ats.length) return true;
    return daysBetween(ats[0].data,h)>=lim;
  });
}
function proxNumeroSol(){
  const ano=new Date().getFullYear();
  const n=state.solicitacoes.filter(s=>String(s.numero||"").indexOf(String(ano))>=0).map(s=>parseInt(String(s.numero).split("-").pop(),10)||0);
  return "SOL-"+ano+"-"+String((n.length?Math.max.apply(null,n):0)+1).padStart(4,"0");
}
function consumoMedio(itemId){
  const jan=cfg().janelaConsumo, lim=addDays(todayISO(),-jan);
  const saidas=state.movimentacoes.filter(m=>m.itemId===itemId&&(m.tipo==="Saída"||m.tipo==="Descarte")&&m.data>=lim);
  if(!saidas.length) return 0;
  const total=saidas.reduce((s,m)=>s+Number(m.qtd||0),0);
  return total/jan;
}
function previsaoDias(item){
  const c=consumoMedio(item.id);
  if(!c) return null;
  return Math.floor(Number(item.quantidade||0)/c);
}
function itensAcabando(){
  return state.estoque.map(i=>({i,d:previsaoDias(i)})).filter(x=>x.d!=null&&x.d<=14&&Number(x.i.quantidade||0)>Number(x.i.minimo||0));
}
function alertaErgonomico(){
  const m={};
  state.pacientes.filter(p=>p.ativo!==false&&String(p.problemaColuna||"").indexOf("Sim")===0).forEach(p=>{
    (p.regioes&&p.regioes.length?p.regioes:["Não especificada"]).forEach(r=>{
      const k=(p.setor||"Sem setor")+"||"+r; m[k]=(m[k]||0)+1;
    });
  });
  return Object.entries(m).filter(([k,v])=>v>=3).map(([k,v])=>({setor:k.split("||")[0],regiao:k.split("||")[1],n:v})).sort((a,b)=>b.n-a.n);
}
function afastMes(mes){ return state.afastamentos.filter(a=>String(a.inicio).slice(0,7)===mes); }
function diasPerdidos(lista){ return lista.reduce((s,a)=>s+Number(a.dias||0),0); }
function ultimos(n){ const out=[],d=new Date(); for(let i=n-1;i>=0;i--){ const m=new Date(d.getFullYear(),d.getMonth()-i,1); out.push(m.getFullYear()+"-"+String(m.getMonth()+1).padStart(2,"0")); } return out; }
function pillSol(st){ const m={"Pendente":"warn","Aprovado":"info","Comprado":"info","Entregue":"ok","Recusado":"crit"}; return '<span class="pill '+(m[st]||"mute")+'">'+esc(st||"—")+'</span>'; }
function pillAt(st){ const m={"Agendado":"info","Realizado":"ok","Faltou":"warn","Cancelado":"mute"}; return '<span class="pill '+(m[st]||"mute")+'">'+esc(st||"—")+'</span>'; }
function pillEst(i){ const q=Number(i.quantidade||0),mn=Number(i.minimo||0);
  if(q<=0) return '<span class="pill crit">Sem estoque</span>';
  if(q<=mn) return '<span class="pill warn">Abaixo do mínimo</span>';
  const d=previsaoDias(i); if(d!=null&&d<=14) return '<span class="pill warn">Acaba em ~'+d+'d</span>';
  return '<span class="pill ok">Ok</span>'; }
function contar(arr,fn){ const m={}; arr.forEach(x=>{ const vs=fn(x); (Array.isArray(vs)?vs:[vs]).filter(Boolean).forEach(v=>{m[v]=(m[v]||0)+1;}); }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
function tile(k,v,n,accent){ return `<div class="tile${accent?" accent":""}"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="n">${esc(n||"")}</div></div>`; }
function tileD(k,v,n,delta,accent){ return `<div class="tile${accent?" accent":""}"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="n">${esc(n||"")}</div><div class="d">${delta||""}</div></div>`; }
function hbars(pairs,emptyMsg,limit){
  if(!pairs.length) return `<div class="empty">${esc(emptyMsg||"Sem dados")}</div>`;
  const list=pairs.slice(0,limit||8),max=list[0][1];
  return `<div class="hbars">${list.map(([k,v])=>`<div class="hbar"><span class="lb" title="${esc(k)}">${esc(k)}</span><span class="bar"><i style="width:${Math.max(4,v/max*100)}%"></i></span><span class="vv">${v}</span></div>`).join("")}</div>`;
}
function barras(pares,fmt){
  const W=520,H=170,pad=28,max=Math.max(1,...pares.map(x=>x[1])),bw=W/Math.max(1,pares.length);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:300px;height:auto" role="img">
    <line x1="0" y1="${H-pad}" x2="${W}" y2="${H-pad}" stroke="var(--line-2)" stroke-width="1"/>
    ${pares.map(([k,v],i)=>{const h=v/max*(H-pad-26),x=i*bw+bw*0.22,w=bw*0.56,y=H-pad-h;return `
      ${v>0?`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="var(--red)" opacity="${i===pares.length-1?1:.72}"/>`:""}
      <text x="${x+w/2}" y="${y-6}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)" font-family="IBM Plex Mono, monospace">${esc(fmt?fmt(v):v)}</text>
      <text x="${x+w/2}" y="${H-pad+15}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Sans, sans-serif">${esc(k)}</text>`;}).join("")}
  </svg>`;
}
function linhaDor(ats){
  const pts=ats.slice().reverse().filter(a=>a.dorAntes!=null&&a.dorDepois!=null);
  if(pts.length<2) return `<div class="empty">São necessárias pelo menos duas sessões com a escala preenchida.</div>`;
  const W=520,H=160,L=30,R=10,T=14,B=26,iw=W-L-R,ih=H-T-B;
  const x=i=>L+(pts.length===1?iw/2:i*iw/(pts.length-1)), y=v=>T+ih-(v/10)*ih;
  const path=arr=>arr.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  const antes=pts.map(p=>Number(p.dorAntes)),depois=pts.map(p=>Number(p.dorDepois));
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:300px;height:auto" role="img" aria-label="Evolução da dor">
    ${[0,5,10].map(v=>`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${v}</text>`).join("")}
    <path d="${path(antes)}" fill="none" stroke="var(--red)" stroke-width="2" stroke-linejoin="round"/>
    <path d="${path(depois)}" fill="none" stroke="var(--ok)" stroke-width="2" stroke-dasharray="4 3" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(Number(p.dorAntes))}" r="3" fill="var(--red)"/><circle cx="${x(i)}" cy="${y(Number(p.dorDepois))}" r="3" fill="var(--ok)"/>
      <text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="IBM Plex Sans, sans-serif">${fdateShort(p.data)}</text>`).join("")}
  </svg>
  <div class="mini" style="margin-top:6px"><span class="swatch" style="background:var(--red)"></span>Chegada <span class="swatch" style="background:var(--ok);margin-left:12px"></span>Saída</div>`;
}

/* ===================== MAPA CORPORAL ===================== */
function corpoSVG(face,pontos,editavel){
  const P=(pontos||[]).filter(p=>p.f===face);
  const corpo=`
    <circle cx="60" cy="24" r="15" />
    <rect x="53" y="38" width="14" height="9" rx="3"/>
    <path d="M38 50 q22-8 44 0 l4 42 q-26 6 -52 0 z"/>
    <path d="M38 50 q-10 4 -12 14 l-6 36 q6 3 10 0 l8-34z"/>
    <path d="M82 50 q10 4 12 14 l6 36 q-6 3 -10 0 l-8-34z"/>
    <path d="M42 92 q18 5 36 0 l-3 44 -5 44 q-6 2 -11 0 l-2-46 -3 46 q-6 2 -11 0 l-5-44z"/>`;
  return `<div><svg viewBox="0 0 120 190" width="150" data-corpo="${face}" ${editavel?'style="cursor:crosshair"':''} role="img" aria-label="Mapa corporal ${face==="f"?"frente":"costas"}">
    <g fill="var(--surface-3)" stroke="var(--line-2)" stroke-width="1" stroke-linejoin="round">${corpo}</g>
    ${face==="b"?'<line x1="60" y1="50" x2="60" y2="92" stroke="var(--line-2)" stroke-width="1" stroke-dasharray="3 3"/>':""}
    ${P.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="${3+p.i}" fill="var(--red)" opacity="${.3+p.i*.23}" stroke="var(--surface)" stroke-width="1" data-pt="${face}:${i}"/>`).join("")}
  </svg><div class="cap">${face==="f"?"Frente":"Costas"}</div></div>`;
}
let pontosAtuais=[],intensidade=2;
function montarMapa(cont,pontos,editavel){
  pontosAtuais=(pontos||[]).slice();
  const desenhar=()=>{
    cont.innerHTML=`<div class="bodymap">${corpoSVG("f",pontosAtuais,editavel)}${corpoSVG("b",pontosAtuais,editavel)}
      <div style="flex:1;min-width:150px">
        ${editavel?`<div class="intsel" style="margin-bottom:10px"><span>Intensidade:</span>
          <button type="button" data-int="1" aria-pressed="${intensidade===1}">Leve</button>
          <button type="button" data-int="2" aria-pressed="${intensidade===2}">Moderada</button>
          <button type="button" data-int="3" aria-pressed="${intensidade===3}">Forte</button></div>
          <div class="mini">Clique no corpo para marcar o ponto de dor. Clique de novo em cima do ponto para remover.</div>`:""}
        <div class="mini" style="margin-top:8px">${pontosAtuais.length} ponto(s) marcado(s)</div>
      </div></div>`;
  };
  desenhar();
  if(!editavel) return;
  cont.addEventListener("click",ev=>{
    const bt=ev.target.closest("[data-int]");
    if(bt){ intensidade=Number(bt.dataset.int); desenhar(); return; }
    const pt=ev.target.closest("[data-pt]");
    if(pt){ const [f,i]=pt.dataset.pt.split(":"); const alvo=pontosAtuais.filter(p=>p.f===f)[Number(i)]; pontosAtuais=pontosAtuais.filter(p=>p!==alvo); desenhar(); return; }
    const svg=ev.target.closest("[data-corpo]");
    if(!svg) return;
    const r=svg.getBoundingClientRect();
    const x=(ev.clientX-r.left)/r.width*120, y=(ev.clientY-r.top)/r.height*190;
    if(y>188) return;
    pontosAtuais.push({f:svg.dataset.corpo,x:Math.round(x*10)/10,y:Math.round(y*10)/10,i:intensidade});
    desenhar();
  });
}

        <td>${String(p.problemaColuna||"").indexOf("Sim")===0?`<span class="pill crit">${esc(p.problemaColuna)}</span><div class="sm" style="margin-top:3px">${esc(p.diagnostico||"")}</div>`:'<span class="pill ok">Sem queixa</span>'}</td>
        <td>${p.usaMedicamento==="Sim"?`<span class="pill warn">Sim</span><div class="sm" style="margin-top:3px">${esc(p.medicamentos||"")}</div>`:'<span class="pill mute">Não</span>'}</td>
        <td class="num">${ats.length}</td>
        <td>${ult?`${fdate(ult.data)}<div class="sm">${atr===0?"hoje":"há "+atr+" dias"}</div>`:'<span class="sm">nunca</span>'}</td>
        <td class="rowact"><button class="btn sm ghost" data-act="ficha" data-id="${p.id}">Ficha</button></td>
      </tr>`;}).join("")}
    </tbody></table></div>`:`<div class="empty"><b>Nenhum colaborador cadastrado</b>Cadastre a primeira ficha ou use o autoatendimento num tablet.</div>`}
  </div>`;
}

function viewFicha(id){
  const p=byId("pacientes",id);
  if(!p){ ctx.paciente=null; return viewPacientes(); }
  const ats=atendDoPaciente(id),real=ats.filter(a=>a.status==="Realizado");
  const comDor=real.filter(a=>a.dorAntes!=null&&a.dorDepois!=null);
  const media=comDor.length?(comDor.reduce((s,a)=>s+(Number(a.dorAntes)-Number(a.dorDepois)),0)/comDor.length).toFixed(1):null;
  const prox=ats.filter(a=>a.status==="Agendado"&&a.data>=todayISO()).sort((a,b)=>a.data.localeCompare(b.data))[0];
  const notas=real.filter(a=>a.avaliacao).map(a=>Number(a.avaliacao));
  const afast=state.afastamentos.filter(a=>a.pacienteId===id).sort((a,b)=>String(b.inicio).localeCompare(String(a.inicio)));
  const pontos=[]; real.forEach(a=>(a.pontos||[]).forEach(pt=>pontos.push(pt)));
  const alerta=[];
  if(p.contraindicacoes) alerta.push(["crit","Contraindicações",p.contraindicacoes]);
  if(p.apto==="Não") alerta.push(["crit","Não liberado para atendimento",p.motivoNaoApto||"Aguardando avaliação médica."]);
  if(p.usaMedicamento==="Sim") alerta.push(["warn","Medicamento em uso",p.medicamentos||"não especificado"]);
  if(p.consentimento!=="Sim") alerta.push(["warn","Termo de consentimento pendente","Colher a assinatura antes da próxima sessão."]);
  if(p.origem==="autoatendimento"&&!p.revisado) alerta.push(["info","Anamnese preenchida pelo colaborador","Revise os dados e confirme para liberar o atendimento."]);

  return `
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap" class="no-print">
    <button class="btn ghost sm" data-act="voltar-lista">← Todos os colaboradores</button>
    <div style="flex:1"></div>
    ${p.origem==="autoatendimento"&&!p.revisado?`<button class="btn sm" data-act="revisar-anamnese" data-id="${p.id}">Confirmar revisão</button>`:""}
    <button class="btn ghost sm" data-act="assinar" data-id="${p.id}">${p.assinaturaId?"Ver/refazer assinatura":"Colher assinatura"}</button>
    <button class="btn ghost sm" data-act="anexar" data-id="${p.id}">Anexar exame</button>
    <button class="btn ghost sm" data-act="afastar" data-id="${p.id}">Registrar afastamento</button>
    <button class="btn ghost sm" data-act="imprimir">Imprimir</button>
    <button class="btn ghost sm" data-act="edit-paciente" data-id="${p.id}">Editar ficha</button>
    <button class="btn sm" data-act="novo-atend" data-id="${p.id}">Novo atendimento</button>
  </div>

  <div class="card"><div class="card-b" style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start">
    <div style="flex:1 1 260px;min-width:0">
      <h2 style="font-size:20px">${esc(p.nome)}</h2>
      <div style="color:var(--muted);font-size:12.5px;margin:3px 0 12px">${esc(p.funcao||"—")} · ${esc(p.setor||"—")} · ${esc(p.turno||"—")}</div>
      <dl class="kv">
        <dt>Matrícula</dt><dd class="mono">${esc(p.matricula||"—")}</dd>
        <dt>Nascimento</dt><dd>${fdate(p.nascimento)} ${idade(p.nascimento)?"("+idade(p.nascimento)+" anos)":""}</dd>
        <dt>Contato</dt><dd>${esc(p.telefone||"—")}</dd>
        <dt>Admissão</dt><dd>${fdate(p.admissao)}</dd>
        <dt>Situação</dt><dd>${p.ativo===false?'<span class="pill mute">Inativo</span>':'<span class="pill ok">Ativo</span>'}</dd>
        <dt>Consentimento</dt><dd>${p.consentimento==="Sim"?'<span class="pill ok">Assinado</span>'+(p.assinaturaEm?' <span class="mini">'+fdate(p.assinaturaEm)+'</span>':""):'<span class="pill warn">Pendente</span>'}</dd>
        <dt>Cadastro</dt><dd class="mini">${p.criadoPor?'por <span data-uid="'+esc(p.criadoPor)+'">alguém</span>':"—"}${p.atualizadoEm?" · alterado em "+fdate(p.atualizadoEm.slice(0,10)):""}</dd>
      </dl>
    </div>
    <div style="flex:1 1 240px;display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:10px">
      ${tile("Sessões",real.length,"realizadas",true)}
      ${tile("Alívio médio",media==null?"—":("−"+media),"escala 0–10")}
      ${tile("Faltas",ats.filter(a=>a.status==="Faltou").length,"registradas")}
      ${tile("Satisfação",notas.length?(notas.reduce((s,n)=>s+n,0)/notas.length).toFixed(1)+"/5":"—",plural(notas.length,"avaliação","avaliações"))}
      ${tile("Dias perdidos",diasPerdidos(afast),plural(afast.length,"afastamento"))}
      ${tile("Próxima",prox?fdateShort(prox.data):"—",prox?(prox.hora||"")+" · "+(prox.tipo||""):"sem agendamento")}

  </div></div>

  ${alerta.length?`<div class="card"><div class="card-h"><h2>Atenção clínica</h2></div><div class="card-b stack">
    ${alerta.map(a=>`<div class="alert ${a[0]}"><div class="grow"><b>${esc(a[1])}</b><div style="opacity:.9;margin-top:2px">${esc(a[2])}</div></div></div>`).join("")}</div></div>`:""}

  <div class="grid2">
    <div class="card"><div class="card-h"><h2>Quadro clínico</h2></div><div class="card-b">
      <dl class="kv">
        <dt>Problema na coluna</dt><dd>${esc(p.problemaColuna||"Não informado")}</dd>
        <dt>Diagnóstico</dt><dd>${esc(p.diagnostico||"—")}</dd>
        <dt>Regiões afetadas</dt><dd>${(p.regioes||[]).length?(p.regioes||[]).map(r=>'<span class="pill mute" style="margin:0 4px 4px 0">'+esc(r)+'</span>').join(""):"—"}</dd>
        <dt>Exames</dt><dd>${esc(p.exames||"—")}</dd>
        <dt>Cirurgias</dt><dd>${esc(p.cirurgias||"—")}</dd>
        <dt>Medicamentos</dt><dd>${p.usaMedicamento==="Sim"?esc(p.medicamentos||"Sim (não especificado)"):"Não usa"}</dd>
        <dt>Atividade física</dt><dd>${esc(p.atividade||"—")}</dd>
        <dt>Posto de trabalho</dt><dd>${esc(p.posto||"—")}</dd>
        <dt>Esforço no cargo</dt><dd>${esc(p.esforco||"—")}</dd>
        <dt>Observações</dt><dd>${esc(p.observacoes||"—")}</dd>
      </dl>
      <div class="sect" style="margin-top:14px"><div class="st">Anexos</div>
        ${(p.anexos||[]).length?`<div class="chips">${(p.anexos||[]).map((an,i)=>`<span class="filechip"><a href="/_blob/${esc(an.id)}" target="_blank" rel="noopener">${esc(an.nome)}</a><button type="button" class="icon-btn no-print" data-act="rm-anexo" data-id="${p.id}" data-i="${i}" style="width:22px;height:22px" aria-label="Remover"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span>`).join("")}</div>`:`<div class="mini">Nenhum laudo, exame ou atestado anexado.</div>`}
      </div>
      ${p.assinaturaId?`<div class="sect"><div class="st">Termo assinado</div><img src="/_blob/${esc(p.assinaturaId)}" alt="Assinatura do colaborador" style="max-width:320px;border:1px solid var(--line);border-radius:8px;background:#fff"></div>`:""}
    </div></div>
    <div class="card"><div class="card-h"><h2>Mapa corporal acumulado</h2><div class="grow"></div><span class="pill mute">${pontos.length} marcações</span></div>
      <div class="card-b">${pontos.length?`<div class="bodymap">${corpoSVG("f",pontos,false)}${corpoSVG("b",pontos,false)}<div style="flex:1;min-width:140px" class="mini">Cada ponto é uma queixa registrada numa sessão. Quanto mais forte a cor, maior a intensidade relatada.</div></div>`:`<div class="empty">Marque os pontos de dor ao registrar um atendimento.</div>`}</div>
    </div>
  </div>

  <div class="grid2">
    <div class="card"><div class="card-h"><h2>Evolução da dor</h2></div><div class="card-b">${linhaDor(real)}</div></div>
    <div class="card"><div class="card-h"><h2>Afastamentos</h2><div class="grow"></div><span class="pill mute">${plural(diasPerdidos(afast),"dia")}</span></div>
      ${afast.length?`<div class="tblwrap"><table><thead><tr><th>Início</th><th>Dias</th><th>Motivo</th><th></th></tr></thead><tbody>
        ${afast.map(a=>`<tr><td>${fdate(a.inicio)}</td><td class="num">${esc(a.dias)}</td><td>${esc(a.motivo||"—")}${a.relacionado?' <span class="pill crit">coluna</span>':""}</td><td class="rowact no-print"><button class="btn sm ghost" data-act="del-afast" data-id="${a.id}">Excluir</button></td></tr>`).join("")}
      </tbody></table></div>`:`<div class="empty">Nenhum afastamento registrado. É este número que mostra o retorno do programa.</div>`}
    </div>
  </div>

  <div class="card"><div class="card-h"><h2>Histórico de atendimentos</h2><div class="grow"></div><span class="pill mute">${ats.length}</span></div><div class="card-b">
    ${ats.length?`<div class="tl">${ats.map(a=>`<div class="tl-i"><div class="rail"><span class="bl" style="background:${a.status==="Realizado"?"var(--red)":"var(--line-2)"}"></span><span class="ln"></span></div>
      <div class="tl-b">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <b style="font-family:var(--display)">${fdate(a.data)}</b><span class="sm mono" style="color:var(--muted)">${esc(a.hora||"")}</span>${pillAt(a.status)}
          <span style="flex:1"></span><button class="btn sm ghost no-print" data-act="edit-atend" data-id="${a.id}">Abrir</button>
        </div>
        <div style="font-size:12.5px;color:var(--ink-2);margin-top:3px">${esc(a.tipo||"")}${a.queixa?" · "+esc(a.queixa):""}</div>
        ${a.dorAntes!=null&&a.dorDepois!=null?`<div class="mini" style="margin-top:3px">Dor ${a.dorAntes} → ${a.dorDepois} ${Number(a.dorDepois)<Number(a.dorAntes)?'<span class="pill ok" style="margin-left:4px">−'+(a.dorAntes-a.dorDepois)+'</span>':""}${a.avaliacao?' · nota '+a.avaliacao+'/5':""}</div>`:""}
        ${a.evolucao?`<div style="font-size:12.5px;margin-top:5px;color:var(--ink-2)">${esc(a.evolucao)}</div>`:""}
        ${a.criadoPor?`<div class="mini" style="margin-top:3px">registrado por <span data-uid="${esc(a.criadoPor)}">alguém</span></div>`:""}
      </div></div>`).join("")}</div>`:`<div class="empty"><b>Sem atendimentos</b>O histórico aparece aqui após a primeira sessão.</div>`}
  </div></div>`;
}

/* ===================== AGENDA ===================== */
function slots(){
  const c=cfg(),out=[];
  const toMin=h=>Number(h.split(":")[0])*60+Number(h.split(":")[1]||0);
  for(let m=toMin(c.horaInicio);m<toMin(c.horaFim);m+=Number(c.passo||30))
    out.push(String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"));
  return out;
}
function viewAgenda(){
  const aba=ctx.aba.agenda||"semana";
  return `${bannerExemplo()}
  <div class="card">
    <div class="tabs no-print"><button data-aba="agenda:semana" aria-selected="${aba==="semana"}">Semana</button><button data-aba="agenda:lista" aria-selected="${aba==="lista"}">Lista</button></div>
    ${aba==="semana"?agendaSemana():agendaLista()}
  </div>`;
}
function agendaSemana(){
  const c=cfg(),ini=ctx.semana,hoje=todayISO(),sl=slots();
  const dias=c.diasSemana.map(d=>addDays(ini,d));
  const porCel={};
  state.atendimentos.filter(a=>dias.indexOf(a.data)>=0).forEach(a=>{
    const k=a.data+"|"+String(a.hora||"").slice(0,5);
    (porCel[k]=porCel[k]||[]).push(a);
  });
  const clsSt={"Realizado":"done","Faltou":"miss","Cancelado":"canc"};
  return `<div class="card-h"><button class="btn sm ghost" data-sem="-7">←</button><h2>${fdate(dias[0])} a ${fdate(dias[dias.length-1])}</h2><button class="btn sm ghost" data-sem="7">→</button><button class="btn sm ghost" data-sem="0">Hoje</button><div class="grow"></div>
    <span class="mini">Clique num horário livre para agendar</span></div>
  <div class="tblwrap"><div class="wk" style="--cols:${dias.length}">
    <div class="hd"></div>
    ${dias.map(d=>`<div class="hd${d===hoje?" today":""}">${DIAS_SEM[new Date(d+"T00:00").getDay()]}<small>${fdateShort(d)}</small></div>`).join("")}
    ${sl.map(h=>`<div class="hr">${h}</div>`+dias.map(d=>{
      const arr=porCel[d+"|"+h]||[];
      return `<div class="cel" data-slot="${d}|${h}">${arr.map(a=>{const p=byId("pacientes",a.pacienteId)||{};
        return `<button type="button" class="ap ${clsSt[a.status]||""}" data-act="edit-atend" data-id="${a.id}">${esc((p.nome||"—").split(" ")[0])}<small>${esc(a.tipo||"")}</small></button>`;}).join("")}</div>`;
    }).join("")).join("")}
  </div></div>`;
}
function agendaLista(){
  const q=busca.trim().toLowerCase(),hoje=todayISO(),f=ctx.filtroAt||"todos";
  let l=state.atendimentos.slice().sort((a,b)=>String(b.data+(b.hora||"")).localeCompare(String(a.data+(a.hora||""))));
  if(f!=="todos") l=l.filter(a=>f==="futuros"?(a.data>=hoje&&a.status==="Agendado"):a.status===f);
  if(q) l=l.filter(a=>{const p=byId("pacientes",a.pacienteId)||{};return [p.nome,p.setor,a.tipo,a.queixa,a.evolucao].join(" ").toLowerCase().indexOf(q)>=0;});
  return `<div class="card-h"><h2>${l.length} registro(s)</h2><div class="grow"></div>
    <div class="seg">${[["todos","Todos"],["futuros","Agendados"],["Realizado","Realizados"],["Faltou","Faltas"]].map(([k,lb])=>`<button data-filtro="${k}" aria-pressed="${f===k}">${lb}</button>`).join("")}</div></div>
  ${l.length?`<div class="tblwrap"><table><thead><tr><th>Data</th><th>Colaborador</th><th>Tipo</th><th>Regiões</th><th>Dor</th><th>Status</th><th></th></tr></thead><tbody>
    ${l.slice(0,250).map(a=>{const p=byId("pacientes",a.pacienteId)||{},dif=(a.dorAntes!=null&&a.dorDepois!=null)?Number(a.dorAntes)-Number(a.dorDepois):null;return `<tr>
      <td><div class="nm num">${fdate(a.data)}</div><div class="sm mono">${esc(a.hora||"")}</div></td>
      <td><div class="nm">${esc(p.nome||"—")}</div><div class="sm">${esc(p.setor||"")}</div></td>
      <td>${esc(a.tipo||"—")}<div class="sm">${esc((a.tecnicas||[]).slice(0,2).join(", "))}</div></td>
      <td class="sm">${esc((a.regioes||[]).join(", ")||"—")}</td>
      <td>${dif==null?'<span class="sm">—</span>':`<span class="num">${a.dorAntes}→${a.dorDepois}</span> ${dif>0?'<span class="pill ok">−'+dif+'</span>':dif<0?'<span class="pill crit">+'+(-dif)+'</span>':'<span class="pill mute">=</span>'}`}</td>
      <td>${pillAt(a.status)}</td>
      <td class="rowact">${a.status==="Agendado"?`<button class="btn sm" data-act="concluir" data-id="${a.id}">Registrar</button>`:""}<button class="btn sm ghost" data-act="edit-atend" data-id="${a.id}">Abrir</button></td>
    </tr>`;}).join("")}
  </tbody></table></div>`:`<div class="empty"><b>Nenhum atendimento</b>Registre o primeiro em “Novo atendimento”.</div>`}`;
}

/* ===================== SOLICITAÇÕES ===================== */

  <div class="banner no-print"><span class="pill info">Fluxo</span><span class="grow">Pendente → Aprovado → Comprado → Entregue. Ao marcar “Entregue” dá para lançar as quantidades direto no estoque da sala.</span></div>

        <td><div class="nm mono">${esc(s.numero||"—")}</div><div class="sm">${fdate(s.data)}${dias!=null&&dias>3?` · <span style="color:var(--crit)">há ${dias} dias</span>`:""}</div></td>
        <td><div class="nm">${(s.itens||[]).length} item(ns)</div><div class="sm">${esc((s.itens||[]).map(i=>i.qtd+" "+(i.unidade||"")+" "+i.descricao).join(" · ").slice(0,90))}</div></td>
        <td>${s.urgencia==="Urgente"?'<span class="pill crit">Urgente</span>':'<span class="pill mute">Normal</span>'}</td>

      </tr>`;}).join("")}

  </div>`;
}

/* ===================== ESTOQUE ===================== */
function viewEstoque(){
  const aba=ctx.aba.estoque||"itens";
  return `${bannerExemplo()}
  ${estoqueBaixo().length?`<div class="alert crit no-print"><div class="grow"><b>${estoqueBaixo().length} item(ns) precisam de reposição</b><div style="opacity:.9">${esc(estoqueBaixo().map(i=>i.item).join(" · "))}</div></div><button class="btn sm" data-act="gerar-sol-falta">Gerar solicitação</button></div>`:""}
  <div class="card">
    <div class="tabs no-print"><button data-aba="estoque:itens" aria-selected="${aba==="itens"}">Itens</button><button data-aba="estoque:mov" aria-selected="${aba==="mov"}">Movimentações</button></div>
    ${aba==="itens"?estoqueItens():estoqueMov()}
  </div>`;
}
function estoqueItens(){
  const q=busca.trim().toLowerCase(),hoje=todayISO();
  let l=state.estoque.slice().sort((a,b)=>{
    const sa=(Number(a.quantidade||0)<=Number(a.minimo||0))?0:1,sb=(Number(b.quantidade||0)<=Number(b.minimo||0))?0:1;
    return sa-sb||String(a.item).localeCompare(String(b.item),"pt");
  });
  if(q) l=l.filter(i=>[i.item,i.categoria,i.fornecedor,i.local].join(" ").toLowerCase().indexOf(q)>=0);
  return `<div class="card-h"><h2>${l.length} item(ns) na sala</h2><div class="grow"></div><span class="pill mute">Baixa automática ao registrar atendimento</span><button class="btn sm ghost" data-act="exp-est">Exportar CSV</button></div>
  ${l.length?`<div class="tblwrap"><table><thead><tr><th>Item</th><th>Categoria</th><th>Quantidade</th><th>Mínimo</th><th>Consumo / previsão</th><th>Validade</th><th>Situação</th><th></th></tr></thead><tbody>
    ${l.map(i=>{const dv=i.validade?daysBetween(hoje,i.validade):null,cm=consumoMedio(i.id),pv=previsaoDias(i);return `<tr>
      <td><div class="nm">${esc(i.item)}</div><div class="sm">${esc([i.fornecedor,i.local].filter(Boolean).join(" · "))}</div></td>
      <td class="sm">${esc(i.categoria||"—")}</td>

/* ===================== MÉTRICAS E VARIAÇÃO ===================== */
const METRICAS=[
  {k:"atendimentos",lb:"Atendimentos realizados",up:true,fmt:v=>v==null?"—":String(Math.round(v))},
  {k:"colaboradores",lb:"Colaboradores atendidos",up:true,fmt:v=>v==null?"—":String(Math.round(v))},
  {k:"comDor",lb:"Colaboradores com dor moderada ou forte",up:false,fmt:v=>v==null?"—":String(Math.round(v))},
  {k:"dorChegada",lb:"Dor média na chegada",up:false,fmt:v=>v==null?"—":v.toFixed(1)},
  {k:"alivio",lb:"Alívio médio por sessão",up:true,fmt:v=>v==null?"—":"−"+v.toFixed(1)},
  {k:"dias",lb:"Dias perdidos por afastamento",up:false,fmt:v=>v==null?"—":String(Math.round(v))},
  {k:"custo",lb:"Custo estimado do afastamento",up:false,fmt:v=>v==null?"—":brl(v)},
  {k:"faltas",lb:"Faltas em sessões agendadas",up:false,fmt:v=>v==null?"—":String(Math.round(v))},
  {k:"satisfacao",lb:"Satisfação média",up:true,fmt:v=>v==null?"—":v.toFixed(1)+"/5"}
];
function metricasMes(m){
  const real=state.atendimentos.filter(a=>a.status==="Realizado"&&String(a.data).slice(0,7)===m);
  const comDor=real.filter(a=>a.dorAntes!=null&&a.dorDepois!=null);
  const notas=real.filter(a=>a.avaliacao).map(a=>Number(a.avaliacao));
  const dias=diasPerdidos(afastMes(m));
  return {
    mes:m,
    atendimentos:real.length,
    colaboradores:new Set(real.map(a=>a.pacienteId)).size,
    comDor:new Set(real.filter(a=>Number(a.dorAntes)>=4).map(a=>a.pacienteId)).size,
    dorChegada:comDor.length?comDor.reduce((s,a)=>s+Number(a.dorAntes),0)/comDor.length:null,
    alivio:comDor.length?comDor.reduce((s,a)=>s+(Number(a.dorAntes)-Number(a.dorDepois)),0)/comDor.length:null,
    dias:dias, custo:dias*cfg().custoDia,
    faltas:state.atendimentos.filter(a=>a.status==="Faltou"&&String(a.data).slice(0,7)===m).length,
    satisfacao:notas.length?notas.reduce((s,n)=>s+n,0)/notas.length:null,
    setores:contar(real,a=>{const p=byId("pacientes",a.pacienteId);return p?p.setor:null;}),
    regioes:contar(real,a=>a.regioes||[]),
    tecnicas:contar(real,a=>a.tecnicas||[])
  };
}
function mesAnterior(m){ const d=new Date(Number(m.slice(0,4)),Number(m.slice(5,7))-1,1); d.setMonth(d.getMonth()-1); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function variacao(a,b){ if(a==null||b==null) return null; if(b===0) return a?Infinity:0; return (a-b)/b*100; }
function deltaHTML(a,b,up,sufixo){
  const v=variacao(a,b);
  if(v===null) return '<span class="delta flat">sem base</span>';
  if(v===Infinity) return '<span class="delta '+(up?"up":"down")+'">novo</span>';
  if(Math.abs(v)<0.5) return '<span class="delta flat">estável'+(sufixo||"")+'</span>';
  const sobe=v>0,bom=up?sobe:!sobe;
  return '<span class="delta '+(bom?"up":"down")+'">'+(sobe?"▲":"▼")+" "+Math.abs(v).toFixed(0)+"%"+(sufixo||"")+'</span>';
}
function textoVar(a,b,up){
  const v=variacao(a,b);
  if(v===null||v===Infinity||Math.abs(v)<0.5) return "estável em relação ao mês anterior";
  return Math.abs(v).toFixed(0)+"% "+(v>0?"acima":"abaixo")+" do mês anterior";
}
function barrasVar(meses,vals,up,fmt){
  const W=560,H=215,padB=30,padT=46;
  const max=Math.max(1,...vals.map(v=>Number(v||0))),bw=W/Math.max(1,meses.length);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px;height:auto" role="img" aria-label="Evolução mensal com variação">
    <line x1="0" y1="${H-padB}" x2="${W}" y2="${H-padB}" stroke="var(--line-2)" stroke-width="1"/>
    ${meses.map((m,i)=>{
      const v=Number(vals[i]||0),h=v/max*(H-padB-padT),x=i*bw+bw*0.24,w=bw*0.52,y=H-padB-h;
      const ant=i?Number(vals[i-1]||0):null,va=i?variacao(v,ant):null;
      let dl="",dc="var(--muted)";
      if(i&&va!==null&&va!==Infinity&&Math.abs(va)>=0.5){ const sobe=va>0; dc=(up?sobe:!sobe)?"var(--ok)":"var(--crit)"; dl=(sobe?"▲":"▼")+" "+Math.abs(va).toFixed(0)+"%"; }
      else if(i&&va===Infinity){ dl="novo"; }
      return `${v>0?`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="var(--red)" opacity="${i===meses.length-1?1:.68}"/>`:""}
        <text x="${x+w/2}" y="${y-7}" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)" font-family="IBM Plex Mono, monospace">${esc(fmt?fmt(v):v)}</text>
        ${dl?`<text x="${x+w/2}" y="${y-22}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${dc}" font-family="IBM Plex Sans, sans-serif">${dl}</text>`:""}
        <text x="${x+w/2}" y="${H-padB+15}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Sans, sans-serif">${esc(mesCurto(m))}</text>`;
    }).join("")}
  </svg>`;
}
function barrasDiverg(meses,vals,up){
  const W=560,H=230,padB=26,padT=16;
  const pcts=meses.map((m,i)=>i?variacao(Number(vals[i]),Number(vals[i-1])):null);
  const fin=pcts.filter(v=>v!==null&&v!==Infinity).map(v=>Math.abs(v));
  const max=Math.max(10,...fin),bw=W/Math.max(1,meses.length);
  const mid=padT+(H-padT-padB)/2,half=(H-padT-padB)/2-12;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px;height:auto" role="img" aria-label="Variação percentual mês a mês">
    <line x1="0" y1="${mid}" x2="${W}" y2="${mid}" stroke="var(--line-2)" stroke-width="1"/>
    <text x="2" y="${mid-5}" font-size="9.5" fill="var(--muted)" font-family="IBM Plex Sans, sans-serif">0%</text>
    ${meses.map((m,i)=>{
      const x=i*bw+bw*0.3,w=bw*0.4,v=pcts[i];
      let corpo="",rot="";
      if(i===0) rot="base";
      else if(v===null) rot="—";
      else if(v===Infinity) rot="novo";
      else{
        const h=Math.min(half,Math.abs(v)/max*half),sobe=v>0,bom=up?sobe:!sobe;
        const cor=Math.abs(v)<0.5?"var(--line-2)":(bom?"var(--ok)":"var(--crit)");
        corpo=`<rect x="${x}" y="${sobe?mid-h:mid}" width="${w}" height="${Math.max(h,1.5)}" rx="2.5" fill="${cor}"/>`;
        rot=(Math.abs(v)<0.5?"0%":((sobe?"+":"−")+Math.abs(v).toFixed(0)+"%"));
        return `${corpo}<text x="${x+w/2}" y="${sobe?mid-h-6:mid+h+13}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${cor}" font-family="IBM Plex Mono, monospace">${rot}</text>
          <text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Sans, sans-serif">${esc(mesCurto(m))}</text>`;
      }
      return `<text x="${x+w/2}" y="${mid+13}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Sans, sans-serif">${rot}</text>
        <text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="IBM Plex Sans, sans-serif">${esc(mesCurto(m))}</text>`;
    }).join("")}
  </svg>`;
}
function tabelaComparativa(mA,mB){
  const a=metricasMes(mA),b=metricasMes(mB);
  return `<div class="tblwrap"><table class="cmp"><thead><tr><th>Indicador</th><th style="text-align:right">${esc(mesLabel(mB))}</th><th style="text-align:right">${esc(mesLabel(mA))}</th><th style="text-align:right">Variação</th></tr></thead><tbody>
    ${METRICAS.map(m=>`<tr><td>${esc(m.lb)}</td><td class="n">${esc(m.fmt(b[m.k]))}</td><td class="n">${esc(m.fmt(a[m.k]))}</td><td class="n">${deltaHTML(a[m.k],b[m.k],m.up)}</td></tr>`).join("")}
  </tbody></table></div>`;
}

/* ===================== MODAL / FORM HELPERS ===================== */
let modalSubmit=null;
function openModal(title,sub,body,footer,cls){
  $("#modal-root").innerHTML=`<div class="ov ${cls||""}" id="ov"><div class="modal" role="dialog" aria-modal="true">
    <div class="modal-h"><div style="flex:1"><h3>${esc(title)}</h3>${sub?`<div class="sub">${esc(sub)}</div>`:""}</div>
      <button class="icon-btn" data-close="1" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <form id="mform"><div class="modal-b">${body}</div>
    <div class="modal-f">${footer||'<button type="button" class="btn ghost" data-close="1">Cancelar</button><button type="submit" class="btn">Salvar</button>'}</div></form>
  </div></div>`;
  const f=$("#mform");
  f.addEventListener("submit",async ev=>{ ev.preventDefault();
    const b=f.querySelector('button[type="submit"]'); const lbl=b?b.textContent:"";
    if(b){b.disabled=true;b.textContent="Salvando…";}
    try{ if(modalSubmit) await modalSubmit(new FormData(f),f); closeModal(); }
    catch(e){ if(b){b.disabled=false;b.textContent=lbl;} }
  });
  $("#ov").addEventListener("mousedown",e=>{ if(e.target.id==="ov") closeModal(); });
  document.body.classList.add("has-modal");
}
function closeModal(){ $("#modal-root").innerHTML=""; modalSubmit=null; document.body.classList.remove("has-modal"); }
function sel(name,opts,val,extra){ return `<select name="${name}" ${extra||""}>${opts.map(o=>`<option value="${esc(o)}"${String(val)===String(o)?" selected":""}>${esc(o)}</option>`).join("")}</select>`; }
function chips(name,opts,vals){ vals=vals||[]; return `<div class="chips">${opts.map(o=>`<label class="chip"><input type="checkbox" name="${name}" value="${esc(o)}"${vals.indexOf(o)>=0?" checked":""}>${esc(o)}</label>`).join("")}</div>`; }
function fl(lb,inner){ return `<label class="fl"><span>${esc(lb)}</span>${inner}</label>`; }
function multi(fd,name){ return fd.getAll(name).filter(Boolean); }

  <div class="f">
    ${flags.length?`<div class="alert crit"><div class="grow"><b>Verifique antes de aplicar qualquer técnica</b><div style="opacity:.92;margin-top:2px">${flags.map(f=>esc(f)).join("<br>")}</div>

    <div class="fr">
      ${fl("Colaborador *",`<select name="pacienteId" required><option value="">— selecione —</option>${pacs.map(x=>`<option value="${esc(x.id)}"${x.id===pid?" selected":""}>${esc(x.nome)} — ${esc(x.setor||"")}</option>`).join("")}</select>`)}
      ${fl("Data *",`<input type="date" name="data" required value="${esc(a.data||dh[0]||todayISO())}">`)}
      ${fl("Hora",`<input type="time" name="hora" value="${esc(a.hora||dh[1]||c.horaInicio)}">`)}

      ${profs.length?fl("Profissional",`<select name="profissionalId"><option value="">— selecione —</option>${profs.map(x=>`<option value="${esc(x.id)}"${a.profissionalId===x.id?" selected":""}>${esc(x.nome)}</option>`).join("")}</select>`):""}
    </div>
    ${fl("Queixa principal",`<input name="queixa" placeholder="Ex.: dor lombar ao levantar peso" value="${esc(a.queixa||"")}">`)}
    ${fl("Regiões trabalhadas",chips("regioes",REGIOES,a.regioes))}
    <div class="sect"><div class="st">Mapa corporal</div><div id="mapa"></div></div>
    <div class="sect"><div class="st">Escala de dor (0 a 10)</div><div class="fr">
      ${fl("Antes da sessão",`<input type="number" name="dorAntes" min="0" max="10" step="1" value="${a.dorAntes==null?"":esc(a.dorAntes)}">`)}
      ${fl("Depois da sessão",`<input type="number" name="dorDepois" min="0" max="10" step="1" value="${a.dorDepois==null?"":esc(a.dorDepois)}">`)}

    </div></div>
    <div class="sect"><div class="st">Técnicas aplicadas</div>${chips("tecnicas",TECNICAS,a.tecnicas)}</div>
    <div class="sect"><div class="st">Materiais utilizados <span class="pill mute" style="text-transform:none;letter-spacing:0">baixa automática</span></div>

      <div class="fr" style="margin-top:12px">
        ${fl("Próxima sessão",`<input type="date" name="proxima" value="${esc(a.proxima||"")}">`)}
        ${fl("Encaminhamento",sel("encaminhamento",["Nenhum","Médico do trabalho","Fisioterapia","Ergonomia / posto de trabalho","Exame de imagem"],a.encaminhamento))}
        ${id?"":fl("Repetir semanalmente por",sel("repetir",["Não repetir","2 semanas","4 semanas","6 semanas","8 semanas","12 semanas"],"Não repetir"))}

  montarMapa($("#mapa"),a.pontos||[],true);
  const mats=$("#mats");
  $("#add-mat").onclick=()=>mats.insertAdjacentHTML("beforeend",linhaMaterial("",1));
  $("#modal-root").addEventListener("click",e=>{ const b=e.target.closest("[data-rm-mat]"); if(b) b.closest("[data-mat]").remove(); });

  modalSubmit=async fd=>{
    const o={};
    ["pacienteId","data","hora","tipo","status","queixa","evolucao","proxima","encaminhamento","profissionalId"].forEach(k=>o[k]=(fd.get(k)||"").toString());
    o.duracao=Number(fd.get("duracao")||0);
    o.regioes=multi(fd,"regioes"); o.tecnicas=multi(fd,"tecnicas");
    o.pontos=pontosAtuais.slice();
    o.redflag=!!fd.get("redflag");
    const da=fd.get("dorAntes"),dd=fd.get("dorDepois"),av=fd.get("avaliacao");

    o.dorDepois=(dd===""||dd==null)?null:Number(dd);
    o.avaliacao=av?Number(av):null;
    const nomes=fd.getAll("mat_nome"),qtds=fd.getAll("mat_qtd");
    o.materiais=nomes.map((n,i)=>({nome:n,qtd:Number(qtds[i]||0)})).filter(m=>m.nome&&m.qtd>0);
    o.criadoEm=a.criadoEm||new Date().toISOString();
    o.criadoPor=a.criadoPor||EU.id||"";
    if(a.exemplo) o.exemplo=true;
    const conflito=state.atendimentos.find(x=>x.id!==id&&x.data===o.data&&String(x.hora).slice(0,5)===String(o.hora).slice(0,5)&&x.status!=="Cancelado"&&(!o.profissionalId||!x.profissionalId||x.profissionalId===o.profissionalId));
    if(conflito){
      const pc=byId("pacientes",conflito.pacienteId)||{};
      if(!confirm("Já existe atendimento de "+(pc.nome||"outro colaborador")+" em "+fdate(o.data)+" às "+o.hora+". Deseja agendar mesmo assim?")) throw new Error("conflito");
    }
    const novoId=id||uid();
    await put("atendimentos",novoId,o);
    await aplicarBaixa(a.materiais||[],o.materiais,novoId);
    let extra="";
    const rep=fd.get("repetir");
    if(!id&&rep&&rep!=="Não repetir"){
      const n=parseInt(rep,10);
      for(let k=1;k<n;k++){
        await put("atendimentos",uid(),{pacienteId:o.pacienteId,data:addDays(o.data,7*k),hora:o.hora,tipo:"Sessão de manutenção",status:"Agendado",duracao:o.duracao,profissionalId:o.profissionalId,queixa:o.queixa,regioes:o.regioes,tecnicas:[],materiais:[],pontos:[],dorAntes:null,dorDepois:null,avaliacao:null,evolucao:"",criadoEm:new Date().toISOString(),criadoPor:EU.id||""},true);
      }
      extra=" · "+(n-1)+" sessões semanais agendadas";
    } else if(o.proxima&&!id){
      await put("atendimentos",uid(),{pacienteId:o.pacienteId,data:o.proxima,hora:o.hora,tipo:"Retorno",status:"Agendado",duracao:o.duracao,profissionalId:o.profissionalId,queixa:o.queixa,regioes:o.regioes,tecnicas:[],materiais:[],pontos:[],dorAntes:null,dorDepois:null,avaliacao:null,evolucao:"",criadoEm:new Date().toISOString(),criadoPor:EU.id||""},true);
      extra=" · retorno em "+fdate(o.proxima);
    }
    toast("Atendimento salvo"+extra);
  };
}
async function registrarMov(item,tipo,qtd,motivo,atendimentoId){
  if(!qtd) return;
  await put("movimentacoes",uid(),{itemId:item.id,item:item.item,tipo:tipo,qtd:Math.abs(qtd),motivo:motivo||"",atendimentoId:atendimentoId||"",data:todayISO(),por:EU.id||"",criadoEm:new Date().toISOString()},true);
  if(state.movimentacoes.length>520){
    const velhas=state.movimentacoes.slice().sort((a,b)=>String(a.data+(a.criadoEm||"")).localeCompare(String(b.data+(b.criadoEm||"")))).slice(0,state.movimentacoes.length-500);
    for(const m of velhas) await del("movimentacoes",m.id);
  }
}
async function aplicarBaixa(antes,depois,atendimentoId){
  const delta={};
  (depois||[]).forEach(m=>delta[m.nome]=(delta[m.nome]||0)+m.qtd);
  (antes||[]).forEach(m=>delta[m.nome]=(delta[m.nome]||0)-m.qtd);
  for(const nome of Object.keys(delta)){
    if(!delta[nome]) continue;
    const it=state.estoque.find(x=>x.item===nome);
    if(!it) continue;
    const copy=Object.assign({},it); delete copy.id;
    copy.quantidade=Math.max(0,Number(it.quantidade||0)-delta[nome]);
    await put("estoque",it.id,copy,true);
    await registrarMov(it,delta[nome]>0?"Saída":"Entrada",delta[nome],"Atendimento",atendimentoId);
  }
}

/* ---- Assinatura e anexos (capability assets) ---- */
function formAssinatura(id){
  const p=byId("pacientes",id); if(!p) return;
  if(!ASSETS){ toast("Assinatura indisponível neste acesso","crit"); return; }
  openModal("Termo de consentimento",p.nome,`
  <div class="f">
    <div class="alert info"><div class="grow"><b>Consentimento para atendimento e tratamento de dados de saúde</b>
      <div style="opacity:.92;margin-top:4px">Declaro que fui informado(a) sobre a avaliação e as técnicas de quiropraxia que podem ser aplicadas, que respondi com veracidade às perguntas de saúde e que autorizo a ${esc(cfg().empresa)} a registrar e guardar estas informações exclusivamente para o acompanhamento do meu atendimento na sala de quiropraxia.</div></div></div>
    ${p.assinaturaId?`<div><div class="mini" style="margin-bottom:5px">Assinatura atual (${fdate(p.assinaturaEm)}):</div><img src="/_blob/${esc(p.assinaturaId)}" alt="Assinatura registrada" style="max-width:320px;border:1px solid var(--line);border-radius:8px;background:#fff"></div>`:""}
    <div><div class="mini" style="margin-bottom:5px">Assine no quadro abaixo com o dedo ou o mouse:</div>
      <canvas id="sig" class="sigpad" width="800" height="300"></canvas>
      <button type="button" class="btn ghost sm" id="sig-clear" style="margin-top:8px">Limpar</button></div>
  </div>`,`<div style="flex:1"></div><button type="button" class="btn ghost" data-close="1">Cancelar</button><button type="submit" class="btn">Salvar assinatura</button>`);
  const cv=$("#sig"),cx=cv.getContext("2d");
  cx.lineWidth=3; cx.lineCap="round"; cx.lineJoin="round"; cx.strokeStyle="#111";
  let desenhando=false,usou=false;
  const pos=e=>{ const r=cv.getBoundingClientRect(),t=e.touches?e.touches[0]:e; return [(t.clientX-r.left)/r.width*cv.width,(t.clientY-r.top)/r.height*cv.height]; };
  const start=e=>{ e.preventDefault(); desenhando=true; usou=true; const [x,y]=pos(e); cx.beginPath(); cx.moveTo(x,y); };
  const move=e=>{ if(!desenhando) return; e.preventDefault(); const [x,y]=pos(e); cx.lineTo(x,y); cx.stroke(); };
  const end=()=>{ desenhando=false; };
  cv.addEventListener("pointerdown",start); cv.addEventListener("pointermove",move);
  window.addEventListener("pointerup",end,{once:false});
  $("#sig-clear").onclick=()=>{ cx.clearRect(0,0,cv.width,cv.height); usou=false; };
  modalSubmit=async ()=>{
    if(!usou){ toast("Assine antes de salvar","crit"); throw new Error("vazio"); }
    const tmp=document.createElement("canvas"); tmp.width=cv.width; tmp.height=cv.height;
    const tc=tmp.getContext("2d"); tc.fillStyle="#fff"; tc.fillRect(0,0,tmp.width,tmp.height); tc.drawImage(cv,0,0);
    const blob=await new Promise(r=>tmp.toBlob(r,"image/png"));
    try{
      const res=await ASSETS.upload(blob,{type:"image/png"});
      const copy=Object.assign({},p); delete copy.id;
      copy.assinaturaId=res.id; copy.assinaturaEm=todayISO(); copy.consentimento="Sim";
      await put("pacientes",id,copy);
      toast("Termo assinado e guardado");
    }catch(e){ toast("Falha ao guardar a assinatura ("+((e&&e.code)||"erro")+")","crit"); throw e; }
  };
}
function anexarArquivo(id){
  const p=byId("pacientes",id); if(!p) return;
  if(!ASSETS){ toast("Anexos indisponíveis neste acesso","crit"); return; }
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".pdf,.png,.jpg,.jpeg,.webp,.csv,.txt,.md";
  inp.onchange=async ()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const ext=(f.name.split(".").pop()||"").toLowerCase();
    const map={pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",webp:"image/webp",csv:"text/csv",txt:"text/plain",md:"text/markdown"};
    toast("Enviando "+f.name+"…");
    try{
      const res=await ASSETS.upload(f,{type:map[ext]||f.type});
      const copy=Object.assign({},p); delete copy.id;
      copy.anexos=(p.anexos||[]).concat([{id:res.id,nome:f.name,tipo:res.contentType,em:todayISO()}]);
      await put("pacientes",id,copy);
      toast("Anexo guardado na ficha");
    }catch(e){ toast("Não foi possível anexar ("+((e&&e.code)||"erro")+")","crit"); }
  };
  inp.click();
}

/* ---- Exportação CSV ---- */
function csv(linhas){
  return "﻿"+linhas.map(l=>l.map(c=>{
    const s=(c==null?"":String(c)).replace(/"/g,'""');
    return /[;"\n]/.test(s)?'"'+s+'"':s;
  }).join(";")).join("\r\n");
}
async function baixar(nome,conteudo){
  if(!DOWNLOADS){ toast("Exportação indisponível neste acesso","crit"); return; }
  try{ await DOWNLOADS.save({filename:nome,data:conteudo}); }
  catch(e){ const c=(e&&e.code)||""; if(c!=="declined") toast("Não foi possível exportar ("+c+")","crit"); }
}
function exportar(tipo){
  const hoje=todayISO();
  if(tipo==="pac"){
    const l=[["Nome","Matrícula","Setor","Função","Turno","Nascimento","Idade","Problema na coluna","Diagnóstico","Regiões","Medicamento","Quais","Contraindicações","Consentimento","Sessões realizadas","Situação"]];
    state.pacientes.forEach(p=>l.push([p.nome,p.matricula,p.setor,p.funcao,p.turno,p.nascimento,idade(p.nascimento),p.problemaColuna,p.diagnostico,(p.regioes||[]).join(", "),p.usaMedicamento,p.medicamentos,p.contraindicacoes,p.consentimento,atendDoPaciente(p.id).filter(a=>a.status==="Realizado").length,p.ativo===false?"Inativo":"Ativo"]));
    baixar("colaboradores-"+hoje+".csv",csv(l));
  } else if(tipo==="atend"){
    const l=[["Data","Hora","Colaborador","Setor","Tipo","Status","Queixa","Regiões","Técnicas","Dor antes","Dor depois","Alívio","Avaliação","Duração","Encaminhamento","Evolução"]];
    state.atendimentos.slice().sort((a,b)=>String(a.data).localeCompare(String(b.data))).forEach(a=>{
      const p=byId("pacientes",a.pacienteId)||{};
      l.push([a.data,a.hora,p.nome,p.setor,a.tipo,a.status,a.queixa,(a.regioes||[]).join(", "),(a.tecnicas||[]).join(", "),a.dorAntes,a.dorDepois,(a.dorAntes!=null&&a.dorDepois!=null)?a.dorAntes-a.dorDepois:"",a.avaliacao,a.duracao,a.encaminhamento,a.evolucao]);
    });
    baixar("atendimentos-"+hoje+".csv",csv(l));
  } else if(tipo==="sol"){
    const l=[["Número","Data","Urgência","Status","Item","Qtd","Unidade","Justificativa","Pedido/NF","Previsão","Resposta"]];
    state.solicitacoes.forEach(s=>(s.itens||[]).forEach(i=>l.push([s.numero,s.data,s.urgencia,s.status,i.descricao,i.qtd,i.unidade,s.justificativa,s.pedido,s.previsao,s.resposta])));
    baixar("solicitacoes-"+hoje+".csv",csv(l));
  } else if(tipo==="est"){
    const l=[["Item","Categoria","Quantidade","Unidade","Mínimo","Consumo mensal","Previsão (dias)","Validade","Fornecedor","Local","Situação"]];
    state.estoque.forEach(i=>{const cm=consumoMedio(i.id),pv=previsaoDias(i);l.push([i.item,i.categoria,i.quantidade,i.unidade,i.minimo,cm?(cm*30).toFixed(1):"",pv==null?"":pv,i.validade,i.fornecedor,i.local,Number(i.quantidade||0)<=Number(i.minimo||0)?"Repor":"Ok"]);});
    baixar("estoque-"+hoje+".csv",csv(l));
  } else if(tipo==="json"){
    const dump={gerado:new Date().toISOString(),empresa:cfg().empresa,versao:3};
    COLS.forEach(k=>dump[k]=state[k]);
    baixar("backup-quiropraxia-"+hoje+".json",JSON.stringify(dump,null,1));
  } else if(tipo==="mov"){
    const l=[["Data","Item","Tipo","Quantidade","Motivo"]];
    state.movimentacoes.slice().sort((a,b)=>String(a.data).localeCompare(String(b.data))).forEach(m=>l.push([m.data,m.item,m.tipo,m.qtd,m.motivo]));
    baixar("movimentacoes-"+hoje+".csv",csv(l));
  }
}
